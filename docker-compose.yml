services:
  lastboard-agent:
    image: git.codigosh.com/codigosh/lastboard-agent:latest
    container_name: lastboard-agent
    ports:
      - "2375:2375"
    environment:
      - TOKEN=change-this-to-a-secret-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # Optional hardening — run unprivileged instead of root. The image runs as
    # root unless a user is set, so BOTH lines are needed: the user, and the
    # group that owns the socket. Find its number with:
    #   stat -c %g /var/run/docker.sock
    # user: "65534:65534"
    # group_add:
    #   - "988"
