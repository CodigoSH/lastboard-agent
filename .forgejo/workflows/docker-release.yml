name: Docker Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.codigosh.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker CLI and Buildx
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates

          # Retry transient gateway errors (e.g. 504) on external downloads.
          CURL="curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30"

          # Docker CLI static binary (pinned, no apt/systemd deps)
          $CURL "https://download.docker.com/linux/static/stable/x86_64/docker-29.8.1.tgz" \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker

          # Buildx plugin (pinned)
          mkdir -p /usr/lib/docker/cli-plugins
          $CURL "https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64" \
            -o /usr/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/lib/docker/cli-plugins/docker-buildx

      - name: Fix Docker socket permissions
        run: chmod 666 /var/run/docker.sock

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref, 'Beta') }}
            type=raw,value=rc,enable=${{ contains(github.ref, 'RC') }}
            type=ref,event=tag

      - name: Login to registry
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: echo "${CI_TOKEN}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --push \
            .
