name: Docker Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.codigosh.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Pinned rather than inherited: `ubuntu-latest` is whatever the runner
    # mapped it to the day it registered. The Docker socket is mounted into
    # the job container either way — the runner builds one, from
    # `container:` or from the label, and binds /var/run/docker.sock into it
    # (act/runner/run_context.go, forgejo-runner v13.2.0).
    container: node:24-trixie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Docker CLI and Buildx
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates

          # Retry transient gateway errors (e.g. 504) on external downloads.
          CURL="curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30"

          # Docker CLI static binary (pinned, no apt/systemd deps)
          $CURL "https://download.docker.com/linux/static/stable/x86_64/docker-29.9.2.tgz" \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker

          # Buildx plugin (pinned)
          mkdir -p /usr/lib/docker/cli-plugins
          $CURL "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64" \
            -o /usr/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/lib/docker/cli-plugins/docker-buildx

      - name: Fix Docker socket permissions
        run: chmod 666 /var/run/docker.sock

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Decide which moving tags this version may take
        id: moving
        run: |
          # A moving tag goes only to the newest version of its kind. A tag pushed
          # again for an old release (a history rewrite does that) must not take
          # `latest` back to it: on 24-oct-2026 a re-pushed v1.0.6 did, and
          # `:latest` served a June image for days.
          this="${GITHUB_REF_NAME#v}"
          names=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          # No match is an answer (a repository with no beta yet), not an error: the
          # runner's shell stops on a failed command inside a pipeline.
          [ -n "$names" ] || { echo "no version tags found on the remote: refusing to guess"; exit 1; }
          newest() { { printf '%s\n' "$names" | grep -E "$1" || true; } | sort -V | tail -n 1; }
          stable=$(newest '^[0-9]+\.[0-9]+\.[0-9]+$')
          beta=$(newest '^[0-9]+\.[0-9]+\.[0-9]+-[Bb]eta')
          rc=$(newest '^[0-9]+\.[0-9]+\.[0-9]+-(RC|rc)')
          [ "$this" = "$stable" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || echo "latest=false" >> "$GITHUB_OUTPUT"
          [ "$this" = "$beta" ] && echo "beta=true" >> "$GITHUB_OUTPUT" || echo "beta=false" >> "$GITHUB_OUTPUT"
          [ "$this" = "$rc" ] && echo "rc=true" >> "$GITHUB_OUTPUT" || echo "rc=false" >> "$GITHUB_OUTPUT"
          echo "v$this — newest stable v$stable, beta v$beta, rc v$rc"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          # `latest` is decided by the step above and nowhere else: the action's
          # own `latest=auto` would add it to any stable version it is given.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.moving.outputs.latest == 'true' }}
            type=raw,value=beta,enable=${{ steps.moving.outputs.beta == 'true' }}
            type=raw,value=rc,enable=${{ steps.moving.outputs.rc == 'true' }}
            type=ref,event=tag

      - name: Login to registry
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: echo "${CI_TOKEN}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            $TAGS \
            --push \
            .
