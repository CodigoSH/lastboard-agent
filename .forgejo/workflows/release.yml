name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # The agent is distributed as a container image, built here before the release
  # page is published: the image, the notes, and the tag the site lists.
  release:
    name: Release
    runs-on: ubuntu-latest
    # Pinned here rather than inherited: `ubuntu-latest` is whatever the
    # runner mapped it to the day it registered, which was a Debian from 2021.
    container: node:24-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The notes are built from the commits since the previous tag. The
          # default checkout is one commit deep with only this tag, so the
          # previous tag is not there and neither is anything before HEAD.
          fetch-depth: 0

      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y -qq jq


      # ---- the container image -------------------------------------------
      #
      # The agent is distributed as this image. It used to be built by a
      # workflow of its own, docker-release.yml, which took a second slot of
      # the runner for every release and could publish an image for a release
      # that then failed, or a release with no image. Here it is built before
      # the release page is created: an image that cannot be built stops the
      # release.
      #
      # The Docker socket is mounted into the job container whatever image it
      # runs on (act/runner/run_context.go, forgejo-runner v13.2.0).
      - name: Install Docker CLI and Buildx
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates

          # Retry transient gateway errors (e.g. 504) on external downloads.
          CURL="curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30"

          # Docker CLI static binary (pinned, no apt/systemd deps)
          $CURL "https://download.docker.com/linux/static/stable/x86_64/docker-29.9.2.tgz" \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker

          # Buildx plugin (pinned)
          mkdir -p /usr/lib/docker/cli-plugins
          $CURL "https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64" \
            -o /usr/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/lib/docker/cli-plugins/docker-buildx

      - name: Set lowercase image name
        id: vars
        run: echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Decide which moving tags this version may take
        id: moving
        run: |
          # A moving tag goes only to the newest version of its kind. A tag pushed
          # again for an old release (a history rewrite does that) must not take
          # `latest` back to it: on 24-oct-2026 a re-pushed v1.0.6 did, and
          # `:latest` served a June image for days.
          this="${GITHUB_REF_NAME#v}"
          names=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##')
          # No match is an answer (a repository with no beta yet), not an error: the
          # runner's shell stops on a failed command inside a pipeline.
          [ -n "$names" ] || { echo "no version tags found on the remote: refusing to guess"; exit 1; }
          newest() { { printf '%s\n' "$names" | grep -E "$1" || true; } | sort -V | tail -n 1; }
          stable=$(newest '^[0-9]+\.[0-9]+\.[0-9]+$')
          beta=$(newest '^[0-9]+\.[0-9]+\.[0-9]+-[Bb]eta')
          rc=$(newest '^[0-9]+\.[0-9]+\.[0-9]+-(RC|rc)')
          [ "$this" = "$stable" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || echo "latest=false" >> "$GITHUB_OUTPUT"
          [ "$this" = "$beta" ] && echo "beta=true" >> "$GITHUB_OUTPUT" || echo "beta=false" >> "$GITHUB_OUTPUT"
          [ "$this" = "$rc" ] && echo "rc=true" >> "$GITHUB_OUTPUT" || echo "rc=false" >> "$GITHUB_OUTPUT"
          echo "v$this — newest stable v$stable, beta v$beta, rc v$rc"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: git.codigosh.com/${{ steps.vars.outputs.image }}
          # `latest` is decided by the step above and nowhere else: the action's
          # own `latest=auto` would add it to any stable version it is given.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.moving.outputs.latest == 'true' }}
            type=raw,value=beta,enable=${{ steps.moving.outputs.beta == 'true' }}
            type=raw,value=rc,enable=${{ steps.moving.outputs.rc == 'true' }}
            type=ref,event=tag

      - name: Login to registry
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: echo "${CI_TOKEN}" | docker login git.codigosh.com -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            $TAGS \
            --push \
            .

      - name: Generate Release Notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            echo "Using existing release notes: $NOTES_FILE"
            exit 0
          fi

          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | grep -vE "^$(echo $VERSION | sed 's/[.+*?^${}()|[]/\\&/g')$" | head -n 1 || true)
          LOG_RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"

          get_log() {
            git log $LOG_RANGE --pretty=format:"%s" 2>/dev/null |               grep -iE "$1" |               grep -vE "chore\(release\)|Merge branch|Merge remote-tracking" |               sed -E 's/^(feat|fix|refactor|perf|chore|docs|style)(\([^)]+\))?: //i' |               awk '{$1=toupper(substr($1,1,1))substr($1,2)}1' |               sed 's/^/- /' | sort -u || true
          }

          FEATS=$(get_log "^feat")
          FIXES=$(get_log "^fix")
          CHANGED_LOG=$(get_log "^refactor|^perf|^chore")

          # `if`, not `[ … ] && printf`: under set -e a false test as the last
          # command of the group fails the step whenever that section is empty.
          {
            if [ -n "$FEATS" ]; then printf '### Added\n%s\n\n' "$FEATS"; fi
            if [ -n "$FIXES" ]; then printf '### Fixed\n%s\n\n' "$FIXES"; fi
            if [ -n "$CHANGED_LOG" ]; then printf '### Changed\n%s\n' "$CHANGED_LOG"; fi
          } > "$NOTES_FILE"

      - name: Create or Update Release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          API="${GITHUB_SERVER_URL}/api/v1"
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"

          # Fail fast if the secret is missing — otherwise every API call below
          # silently returns 401 and we would publish nothing while reporting success.
          if [ -z "${CI_TOKEN:-}" ]; then
            echo "::error::CI_TOKEN secret is empty or unset — cannot create the release." >&2
            exit 1
          fi

          # api METHOD URL [curl args...] — runs the call, echoes the response body,
          # and fails the job on any non-2xx status instead of swallowing the error.
          api() {
            local method="$1" url="$2"; shift 2
            local out status body
            out="$(curl -sS -w $'\n%{http_code}' -X "$method" \
              -H "Authorization: token $CI_TOKEN" "$@" "$url")"
            status="${out##*$'\n'}"
            body="${out%$'\n'*}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$method $url returned HTTP $status" >&2
              echo "$body" >&2
              return 1
            fi
            printf '%s' "$body"
          }

          # Detect prerelease
          IS_PRERELEASE=false
          if [[ "$VERSION" == *Beta* || "$VERSION" == *RC* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            IS_PRERELEASE=true
          fi

          # Read release notes
          if [ -f "$NOTES_FILE" ]; then
            NOTES="$(cat "$NOTES_FILE")"
          else
            NOTES="Release $VERSION"
          fi
          NOTES_JSON="$(printf '%s' "$NOTES" | jq -Rs .)"

          # Check if the release already exists (404 is the expected "new" case).
          EXISTING_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $CI_TOKEN" \
            "$API/repos/$REPO/releases/tags/$VERSION")"

          if [ "$EXISTING_STATUS" = "200" ]; then
            echo "Release exists, updating..."
            RELEASE_ID="$(api GET "$API/repos/$REPO/releases/tags/$VERSION" | jq -r '.id')"

            api PATCH "$API/repos/$REPO/releases/$RELEASE_ID" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$VERSION\", \"body\": $NOTES_JSON, \"prerelease\": $IS_PRERELEASE}" > /dev/null
          else
            echo "Creating new release..."
            RELEASE_ID="$(api POST "$API/repos/$REPO/releases" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$VERSION\", \"name\": \"$VERSION\", \"body\": $NOTES_JSON, \"prerelease\": $IS_PRERELEASE}" | jq -r '.id')"
          fi

          # Guard: a valid release must have a numeric ID.
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine release ID (got '$RELEASE_ID')." >&2
            exit 1
          fi
          echo "Release ID: $RELEASE_ID"
          echo "Release $VERSION published."

      # The site reads the latest release from this repository's API at build time, so it is
      # rebuilt once the release exists — and only if it was published. Dispatched rather than
      # done here, so how the site is rebuilt lives in one place: site-rebuild.yml.
      #
      # A step of the release and not a job of its own. It is four seconds of curl, and a job of its
      # own is a slot of the runner, which has one: it went to the back of a queue of everybody
      # else's runs and the release read as running for as long as that took. A step runs only if
      # every step before it passed, which is all the `needs: release` it replaces was for.
      - name: Dispatch the website rebuild
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/site-rebuild.yml/dispatches")
          echo "Website rebuild dispatch HTTP $CODE"
          [ "$CODE" = "204" ] || { echo "Website rebuild dispatch failed (HTTP $CODE)"; exit 1; }
