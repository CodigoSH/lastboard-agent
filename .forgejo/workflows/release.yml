name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    # Pinned here rather than inherited: `ubuntu-latest` is whatever the
    # runner mapped it to the day it registered, which was a Debian from 2021.
    container: node:24-trixie
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Build
        run: |
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}

          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o lastboard-agent .

      - name: Package
        run: tar -czvf lastboard-agent-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz lastboard-agent

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lastboard-agent-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    container: node:24-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The notes are built from the commits since the previous tag. The
          # default checkout is one commit deep with only this tag, so the
          # previous tag is not there and neither is anything before HEAD.
          fetch-depth: 0

      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y -qq jq


      - name: Generate Release Notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            echo "Using existing release notes: $NOTES_FILE"
            exit 0
          fi

          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | grep -vE "^$(echo $VERSION | sed 's/[.+*?^${}()|[]/\\&/g')$" | head -n 1 || true)
          LOG_RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"

          get_log() {
            git log $LOG_RANGE --pretty=format:"%s" 2>/dev/null |               grep -iE "$1" |               grep -vE "chore\(release\)|Merge branch|Merge remote-tracking" |               sed -E 's/^(feat|fix|refactor|perf|chore|docs|style)(\([^)]+\))?: //i' |               awk '{$1=toupper(substr($1,1,1))substr($1,2)}1' |               sed 's/^/- /' | sort -u || true
          }

          FEATS=$(get_log "^feat")
          FIXES=$(get_log "^fix")
          CHANGED_LOG=$(get_log "^refactor|^perf|^chore")

          # `if`, not `[ … ] && printf`: under set -e a false test as the last
          # command of the group fails the step whenever that section is empty.
          {
            if [ -n "$FEATS" ]; then printf '### Added\n%s\n\n' "$FEATS"; fi
            if [ -n "$FIXES" ]; then printf '### Fixed\n%s\n\n' "$FIXES"; fi
            if [ -n "$CHANGED_LOG" ]; then printf '### Changed\n%s\n' "$CHANGED_LOG"; fi
          } > "$NOTES_FILE"

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Generate Checksums
        run: |
          find artifacts -name "*.tar.gz" | sort | while read f; do
            sha256sum "$f" | awk '{print $1 "  " $2}' | sed 's|artifacts/[^/]*/||'
          done > artifacts/checksums.txt
          cat artifacts/checksums.txt

      - name: Set up Go (for signing)
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Sign checksums.txt
        # The README publishes a release public key and tells people to check
        # the signature, so a release without one is a release nobody can
        # verify the way the documentation says. A missing secret is a
        # failure, not a fallback. A fork with no key listed releases unsigned.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if go run ./cmd/sign configured; then
              echo "::error::cmd/sign lists a release public key, so readers will expect"
              echo "::error::checksums.txt.sig. RELEASE_SIGNING_KEY is not set — refusing to"
              echo "::error::publish a release that nobody can verify."
              exit 1
            fi
            echo "No public key listed and no signing key — shipping an unsigned release."
            exit 0
          fi
          go run ./cmd/sign artifacts/checksums.txt
          # Checked against the listed keys before anything is published: a
          # secret that is not the listed key's pair would sign happily and
          # verify for nobody.
          go run ./cmd/sign verify artifacts/checksums.txt artifacts/checksums.txt.sig

      - name: Create or Update Release
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          API="${GITHUB_SERVER_URL}/api/v1"
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"

          # Fail fast if the secret is missing — otherwise every API call below
          # silently returns 401 and we would publish nothing while reporting success.
          if [ -z "${CI_TOKEN:-}" ]; then
            echo "::error::CI_TOKEN secret is empty or unset — cannot create the release." >&2
            exit 1
          fi

          # api METHOD URL [curl args...] — runs the call, echoes the response body,
          # and fails the job on any non-2xx status instead of swallowing the error.
          api() {
            local method="$1" url="$2"; shift 2
            local out status body
            out="$(curl -sS -w $'\n%{http_code}' -X "$method" \
              -H "Authorization: token $CI_TOKEN" "$@" "$url")"
            status="${out##*$'\n'}"
            body="${out%$'\n'*}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$method $url returned HTTP $status" >&2
              echo "$body" >&2
              return 1
            fi
            printf '%s' "$body"
          }

          # Detect prerelease
          IS_PRERELEASE=false
          if [[ "$VERSION" == *Beta* || "$VERSION" == *RC* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            IS_PRERELEASE=true
          fi

          # Read release notes
          if [ -f "$NOTES_FILE" ]; then
            NOTES="$(cat "$NOTES_FILE")"
          else
            NOTES="Release $VERSION"
          fi
          NOTES_JSON="$(printf '%s' "$NOTES" | jq -Rs .)"

          # Check if the release already exists (404 is the expected "new" case).
          EXISTING_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $CI_TOKEN" \
            "$API/repos/$REPO/releases/tags/$VERSION")"

          if [ "$EXISTING_STATUS" = "200" ]; then
            echo "Release exists, updating..."
            RELEASE_ID="$(api GET "$API/repos/$REPO/releases/tags/$VERSION" | jq -r '.id')"

            api PATCH "$API/repos/$REPO/releases/$RELEASE_ID" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"$VERSION\", \"body\": $NOTES_JSON, \"prerelease\": $IS_PRERELEASE}" > /dev/null

            # Delete existing assets before re-uploading
            for asset_id in $(api GET "$API/repos/$REPO/releases/$RELEASE_ID/assets" | jq -r '.[].id'); do
              api DELETE "$API/repos/$REPO/releases/$RELEASE_ID/assets/$asset_id" > /dev/null
            done
          else
            echo "Creating new release..."
            RELEASE_ID="$(api POST "$API/repos/$REPO/releases" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$VERSION\", \"name\": \"$VERSION\", \"body\": $NOTES_JSON, \"prerelease\": $IS_PRERELEASE}" | jq -r '.id')"
          fi

          # Guard: a valid release must have a numeric ID before we upload anything.
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine release ID (got '$RELEASE_ID')." >&2
            exit 1
          fi
          echo "Release ID: $RELEASE_ID"

          # Upload tar.gz files
          find artifacts -name "*.tar.gz" | while read -r f; do
            filename="$(basename "$f")"
            echo "Uploading $filename..."
            api POST "$API/repos/$REPO/releases/$RELEASE_ID/assets" \
              -F "attachment=@$f;filename=$filename" > /dev/null
          done

          # Upload checksums
          echo "Uploading checksums.txt..."
          api POST "$API/repos/$REPO/releases/$RELEASE_ID/assets" \
            -F "attachment=@artifacts/checksums.txt;filename=checksums.txt" > /dev/null

          # And its signature, when the release was signed.
          if [ -f artifacts/checksums.txt.sig ]; then
            echo "Uploading checksums.txt.sig..."
            api POST "$API/repos/$REPO/releases/$RELEASE_ID/assets" \
              -F "attachment=@artifacts/checksums.txt.sig;filename=checksums.txt.sig" > /dev/null
          fi

          echo "Release $VERSION published with all assets."

  # The site reads the latest release from this repository's API at build
  # time, so it is rebuilt once the release exists — and only if it was
  # published. Dispatched rather than done here, so the Coolify call lives in
  # one place.
  trigger-site-rebuild:
    name: Rebuild the website
    needs: release
    runs-on: ubuntu-latest
    container: node:24-trixie
    steps:
      - name: Dispatch the website rebuild
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/site-rebuild.yml/dispatches")
          echo "Website rebuild dispatch HTTP $CODE"
          [ "$CODE" = "204" ] || { echo "Website rebuild dispatch failed (HTTP $CODE)"; exit 1; }
