name: Rebuild the website

# codigosh.com lists this project and its releases, which it reads from this
# repository's API when it builds. A build that ran before a release existed
# keeps advertising the previous version until something else rebuilds the
# site, so release.yml dispatches this once the release is published.
on:
  push:
    branches: [main]
    paths:
      # The site publishes this folder as the agent's documentation, so a change
      # to it has to rebuild the site: without this a correction reached the web
      # only when a release, or an unrelated push to the web itself, rebuilt it.
      - 'docs/**'
      # So a change to this job proves itself on the push that makes it.
      - '.forgejo/workflows/site-rebuild.yml'
  workflow_dispatch:

jobs:
  rebuild:
    name: Rebuild the website
    runs-on: ubuntu-latest
    # `ubuntu-latest` is a label the runner translates, and by default it lands
    # on a Node image built on Debian bullseye — 2021, OpenSSL 1.1.1w. Pinned so
    # what this runs on is a decision in the diff rather than a line in a config
    # file on the server that nothing versions. See the house rule in
    # codigosh/releases.md.
    container: node:24-trixie
    timeout-minutes: 20
    steps:
      - name: Ask the web host to rebuild codigosh-web
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # An unconfigured key is a skip on a push — somebody's fork must not
          # get a red build over a secret they were never given — and a failure
          # when a release asked for this: a rebuild that did not happen must
          # not report success, or the site advertises the wrong version with
          # nobody the wiser.
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_SSH_TARGET" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "A release asked for a rebuild and the deploy key is not configured." >&2
              echo "Set DEPLOY_SSH_KEY, DEPLOY_SSH_TARGET and DEPLOY_KNOWN_HOSTS in this repository's secrets." >&2
              exit 1
            fi
            echo "Deploy secrets not set — skipping the website rebuild."
            exit 0
          fi

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          # The key on the other side runs one fixed command whatever it is
          # asked, and the build runs there with the cache off: the site reads
          # its releases and docs from Forgejo while it builds, so a build that
          # reused its layers would succeed and publish nothing new. The host is
          # pinned, so a wrong machine answering is a failure and not a login.
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$DEPLOY_SSH_TARGET" rebuild
          echo "Website rebuild finished."
