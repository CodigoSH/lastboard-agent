name: CI

# One job that does each thing once, in the same order in every project: the
# checks that fail in seconds first, then the tests, then building the binary
# and starting it. No path filter: tests here read docs/, so a change that is
# only words can still break the build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    # Pinned rather than inherited: `ubuntu-latest` is whatever the runner
    # mapped it to the day it registered, which was a Debian from 2021.
    # This image also carries the C toolchain -race needs.
    container: node:24-trixie
    env:
      # What is published is built without cgo, and Go keeps a separate build
      # cache for each setting: vet, staticcheck and the build compile the whole
      # dependency graph once, here, instead of once for each. Only the race
      # detector needs cgo, and its step says so.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # Pinned to the version the rest of the house runs, so a new check in a new
      # release cannot turn this red on a day nobody touched the code.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # -race needs cgo.
      - name: Go tests
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race -cover ./...

      # Blocking: fails when the code calls a known-vulnerable symbol, most
      # likely in the standard library — the fix is then a Go patch release.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build backend
        run: go build -trimpath -o lastboard-agent .

      # Building is not running. This starts the binary the job just built and
      # asks it a question, which is the difference between "it compiles" and
      # "it works". The token is a throwaway: the agent exits without one, and
      # nothing here reaches a Docker socket.
      - name: Smoke test
        run: |
          TOKEN=ci-smoke-0123456789abcdef0123456789abcdef PORT=8099 \
            SOCKET_PATH=/nonexistent.sock ./lastboard-agent &
          pid=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8099/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/containers)" = 401
          kill $pid
