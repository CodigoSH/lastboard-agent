name: CI

# One job that does each thing once, in the same order in every project: the
# checks that fail in seconds first, then the tests, then building the binary
# and starting it. No path filter: tests here read docs/, so a change that is
# only words can still break the build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    # Pinned rather than inherited: `ubuntu-latest` is whatever the runner
    # mapped it to the day it registered, which was a Debian from 2021.
    # This image also carries the C toolchain the race detector needs, which scripts/release.sh runs.
    container: node:24-trixie
    env:
      # What is published is built without cgo, and Go keeps a separate build
      # cache for each setting: vet, staticcheck and the build compile the whole
      # dependency graph once, here, instead of once for each. Only the race
      # detector needs cgo, and its step says so.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      # setup-go's own cache stays off: its key is written with a capital "Linux" when it is saved
      # and a lower case "linux" when it is looked for, so what one run saves the next never finds.
      # It saved 133 MB on every run to no use. The cache below has a key written here, in full.
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: '1.27.4'
          cache: false

      # The Go build cache and the module cache, so the dependency graph is compiled once and not
      # on every push. The key is the Go version plus go.sum and has no commit in it on purpose: a
      # hit restores and uploads nothing, and the entry is only written again when a dependency or
      # the toolchain changes (the restore key then starts from the previous entry).
      - name: Locate the Go caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ steps.setup-go.outputs.go-version }}-

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # Pinned to the version the rest of the house runs, so a new check in a new
      # release cannot turn this red on a day nobody touched the code.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # The race detector is not run here: it needs cgo and a build of the runtime with it, which
      # was ninety seconds of every push on this runner. scripts/release.sh runs it before a
      # release is tagged, which is when it has to hold. -count=1 so a cached pass proves nothing
      # about a change to docs/, which these tests read from disk.
      # -timeout 10m: Go's own default, spelled out so a package that hangs dies in a named test
      # instead of at the end of the job.
      - name: Go tests
        run: go test -count=1 -timeout 10m -cover ./...

      # Blocking: fails when the code calls a known-vulnerable symbol, most
      # likely in the standard library — the fix is then a Go patch release.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build backend
        run: go build -trimpath -o lastboard-agent .

      # Building is not running. This starts the binary the job just built and
      # asks it a question, which is the difference between "it compiles" and
      # "it works". The token is a throwaway: the agent exits without one, and
      # nothing here reaches a Docker socket.
      - name: Smoke test
        run: |
          TOKEN=ci-smoke-0123456789abcdef0123456789abcdef PORT=8099 \
            SOCKET_PATH=/nonexistent.sock ./lastboard-agent &
          pid=$!
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8099/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/containers)" = 401
          kill $pid
