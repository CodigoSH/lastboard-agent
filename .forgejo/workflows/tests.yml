name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Pinned rather than inherited: `ubuntu-latest` is whatever the runner
    # mapped it to the day it registered, which was a Debian from 2021.
    # This image also carries the C toolchain -race needs.
    container: node:24-trixie
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -v ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o lastboard-agent .

      - name: Run staticcheck
        # Pinned to the version the rest of the house runs, so a new check in
        # a new release cannot turn this red on a day nobody touched the code.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Run govulncheck
        # Blocking: fails when the code calls a known-vulnerable symbol, most
        # likely in the standard library — the fix is then a Go patch release.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
