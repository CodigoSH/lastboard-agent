<!doctype html>
<!--
  The picture the project page and the README lead with, composed in a browser
  instead of assembled by hand.

  The agent has no interface of its own; what it gives you is a dashboard that
  can see other hosts. So the two screens are Lastboard's Docker widget,
  reading two hosts through two agents built from this repository, photographed
  seconds earlier by scripts/docs-mockup.ts: the board in the laptop and the
  same board on a tablet. Not a phone: on a phone-sized screen the dashboard
  shows bookmarks only, by design, so the widget would not be there. The frames are drawn and the background is the site's
  own atmosphere, so all of it can be regenerated when the interface changes.

  Rendered by scripts/docs-mockup.ts — not served to anyone.
-->
<meta charset="utf-8">
<title>Lastboard Agent mockup</title>
<style>
    :root {
        --accent: #e8520e;
        --ink: #f5f5f7;
        --dim: #a1a1aa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #0b0b0d;
        /* The same stack the dashboard in the screens declares, so the wording
           in the mockup and the interface beside it are set in one typeface. */
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--ink);
        position: relative;
        display: grid;
        grid-template-columns: 470px 1fr;
        align-items: center;
    }

    /* The site's atmosphere: a warm glow off the top, and the faint grid the
       constellation sits on. */
    .glow {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(900px 520px at 22% 8%, rgba(232, 82, 14, 0.20), transparent 68%),
            radial-gradient(1100px 700px at 78% 100%, rgba(232, 82, 14, 0.10), transparent 62%);
    }

    .grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(1200px 700px at 40% 40%, #000 20%, transparent 75%);
    }

    /* ── Left: the words ─────────────────────────────────────────────── */
    .copy {
        position: relative;
        padding: 0 0 0 88px;
    }

    .lockup {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 34px;
    }

    .lockup img { width: 54px; height: 54px; }

    .lockup span {
        font-size: 38px;
        font-weight: 600;
        letter-spacing: -0.03em;
    }

    h1 {
        font-size: 62px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.035em;
        margin-bottom: 26px;
    }

    h1 em {
        font-style: normal;
        color: var(--accent);
    }

    p {
        font-size: 21px;
        line-height: 1.5;
        color: var(--dim);
        max-width: 30ch;
    }

    .badges {
        display: flex;
        gap: 10px;
        margin-top: 38px;
    }

    .badge {
        font-size: 14px;
        font-weight: 500;
        color: var(--dim);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
        padding: 7px 15px;
    }

    /* ── Right: the screens ──────────────────────────────────────────── */
    .stage {
        position: relative;
        height: 100%;
    }

    /* A laptop lid: a thin bezel with a bar at the top, nothing skeuomorphic. */
    .laptop {
        position: absolute;
        top: 176px;
        left: 10px;
        width: 1010px;
        border-radius: 14px;
        background: #17171a;
        border: 1px solid rgba(255, 255, 255, 0.10);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }

    .bar {
        height: 26px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        background: #202024;
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a3a40; }

    .laptop img { display: block; width: 100%; }

    /* The tablet overlaps the laptop's corner, showing the same board. */
    .tablet {
        position: absolute;
        top: 470px;
        right: 18px;
        width: 420px;
        border-radius: 26px;
        background: #17171a;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 11px;
        box-shadow: 0 34px 70px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }

    .tablet img {
        display: block;
        width: 100%;
        border-radius: 16px;
    }
</style>

<div class="glow"></div>
<div class="grid"></div>

<div class="copy">
    <div class="lockup">
        <img src="__LOGO__" alt="">
        <span>Lastboard Agent</span>
    </div>
    <h1>Docker on<br>every host,<br><em>one board.</em></h1>
    <p>A small bridge on each host, so Lastboard can watch and control its containers without the Docker daemon ever being exposed.</p>
    <div class="badges">
        <div class="badge">Self-hosted</div>
        <div class="badge">One container</div>
        <div class="badge">Apache-2.0</div>
    </div>
</div>

<div class="stage">
    <div class="laptop">
        <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
        <img src="__DESKTOP__" alt="">
    </div>
    <div class="tablet"><img src="__TABLET__" alt=""></div>
</div>
